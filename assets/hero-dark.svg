  <defs>
    <style>
      .beacon-ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: beacon 2.8s cubic-bezier(0.2, 0.7, 0.3, 1) infinite;
      }
      .core-glow {
        animation: breathe 4.6s ease-in-out infinite;
      }
      @keyframes beacon {
        0% { transform: scale(1); opacity: 0.72; }
        70% { transform: scale(2.4); opacity: 0; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .beacon-ring, .core-glow { animation: none !important; }
      }
    </style>
    <linearGradient id="bg_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111026"/>
      <stop offset="100%" stop-color="#181634"/>
    </linearGradient>
    <radialGradient id="glow_dark" cx="82%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#5A52EA" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5A52EA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen_dark" x1="0%" y1="0%" x2="100%" y2="0%">
