      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots_dark" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9A8DF8" fill-opacity="0.10"/>
    </pattern>
    <linearGradient id="dot_fade_dark" x1="0%" y1="0%" x2="100%" y2="0%">
