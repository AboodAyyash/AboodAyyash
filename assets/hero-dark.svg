<svg xmlns="http://www.w3.org/2000/svg" width="840" height="244" viewBox="0 0 840 244" role="img" aria-label="Abd-Alrahman Ayyash — Chief Executive Officer at Qodra Systems">
  <defs>
    <style>
      .beacon-ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: beacon 3s cubic-bezier(0.2, 0.7, 0.3, 1) infinite;
      }
      @keyframes beacon {
        0% { transform: scale(1); opacity: 0.7; }
        72% { transform: scale(2.4); opacity: 0; }
        100% { transform: scale(2.4); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .beacon-ring { animation: none !important; } }
    </style>
    <linearGradient id="hbg_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131E"/>
      <stop offset="100%" stop-color="#141A29"/>
    </linearGradient>
    <radialGradient id="hglow_dark" cx="82%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="htop_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hdots_dark" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#818CF8" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="hdfade_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <mask id="hdmask_dark">
      <rect width="840" height="244" fill="url(#hdfade_dark)"/>
    </mask>
    <clipPath id="hclip_dark">
      <rect x="0.5" y="0.5" width="839" height="243" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hclip_dark)">
    <rect width="840" height="244" fill="url(#hbg_dark)"/>
    <rect width="840" height="244" fill="url(#hdots_dark)" mask="url(#hdmask_dark)"/>
    <rect width="840" height="244" fill="url(#hglow_dark)"/>
    <rect x="0" y="0" width="840" height="2" fill="url(#htop_dark)"/>
    <line x1="20" y1="2.5" x2="820" y2="2.5" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

    <!-- Left: Executive Identity (cleanly bounded <= 505px) -->
    <rect x="32" y="28" width="214" height="28" rx="14" fill="#161D30" stroke="#2B3656" stroke-width="1"/>
    <circle cx="48" cy="42" r="4" fill="#34D399" class="beacon-ring"/>
    <circle cx="48" cy="42" r="3.6" fill="#34D399"/>
    <text x="61" y="46.2" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.9" fill="#818CF8">CEO · QODRA SYSTEMS</text>

    <text x="32" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8" fill="#F8FAFC">Abd-Alrahman Ayyash</text>

    <text x="32" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#818CF8">Systems Architect  ·  Enterprise Software &amp; AI</text>

    <text x="32" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.8" fill="#9BA6C0">Architecting single-database ERP engines, governed Arabic AI agents,</text>
    <text x="32" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.8" fill="#9BA6C0">and cross-platform operational software from Amman, Jordan.</text>

    
        <rect x="32" y="184" width="138" height="30" rx="8" fill="#141B2B" stroke="#242E48" stroke-width="1"/>
        <g transform="translate(43, 193)" fill="none" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11s3.5-3.1 3.5-5.8a3.5 3.5 0 1 0-7 0C2.5 7.9 6 11 6 11z"/><circle cx="6" cy="5.2" r="1.2"/></g>
        <text x="61" y="203.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Amman, Jordan</text>
        
        <rect x="180" y="184" width="144" height="30" rx="8" fill="#141B2B" stroke="#242E48" stroke-width="1"/>
        <g transform="translate(191, 193)" fill="none" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="6,1.2 10.2,3.6 10.2,8.4 6,10.8 1.8,8.4 1.8,3.6"/></g>
        <text x="209" y="203.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">@qodrasystems</text>
        
        <rect x="334" y="184" width="158" height="30" rx="8" fill="#141B2B" stroke="#242E48" stroke-width="1"/>
        <g transform="translate(345, 193)" fill="none" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5L5 5.5l2.5 2.5L10.5 4"/><path d="M8 4h2.5v2.5"/></g>
        <text x="363" y="203.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#CBD5E1">Building since 2018</text>
        

    <!-- Right: Distinct Builder / Systems Architect Spec Card (x=548..808) -->
    <rect x="548" y="30" width="260" height="184" rx="12" fill="#0C101A" stroke="#232C45" stroke-width="1"/>
    <circle cx="566" cy="48" r="4" fill="#818CF8" fill-opacity="0.7"/>
    <circle cx="580" cy="48" r="4" fill="#34D399" fill-opacity="0.7"/>
    <circle cx="594" cy="48" r="4" fill="#64748B" fill-opacity="0.45"/>
    <text x="794" y="51.5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#64748B">ceo.profile</text>
    <line x1="548" y1="64" x2="808" y2="64" stroke="#232C45" stroke-width="1"/>

    <text x="564" y="88" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#64748B">role</text>
    <text x="632" y="88" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#E2E8F0">Chief Executive</text>

    <text x="564" y="114" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#64748B">company</text>
    <text x="632" y="114" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#818CF8">Qodra Systems</text>

    <text x="564" y="140" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#64748B">core</text>
    <text x="632" y="140" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#E2E8F0">PL/pgSQL · Flutter</text>

    <text x="564" y="166" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#64748B">ai</text>
    <text x="632" y="166" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#E2E8F0">Awni RBAC Agents</text>

    <text x="564" y="192" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#64748B">status</text>
    <circle cx="636" cy="188" r="3.2" fill="#34D399"/>
    <text x="646" y="192" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#34D399">Leading Qodra OS</text>
  </g>

  <rect x="0.5" y="0.5" width="839" height="243" rx="14" fill="none" stroke="#232B42" stroke-width="1"/>
</svg>
