<svg xmlns="http://www.w3.org/2000/svg" width="168" height="40" viewBox="0 0 168 40" role="img" aria-label="Digital Card">
  <defs>
    
        <style>
          .shimmer { animation: sweep 6.5s ease-in-out infinite; }
          @keyframes sweep {
            0%, 62% { transform: translateX(-120px); opacity: 0; }
            72% { opacity: 0.24; }
            96% { transform: translateX(260px); opacity: 0; }
            100% { transform: translateX(260px); opacity: 0; }
          }
          @media (prefers-reduced-motion: reduce) { .shimmer { animation: none !important; opacity: 0; } }
        </style>
        
    <linearGradient id="btn_btn-card_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#625AF2"/>
      <stop offset="100%" stop-color="#4D45DC"/>
    </linearGradient>
    <linearGradient id="btn_sheen_btn-card_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="btn_clip_btn-card_dark">
      <rect x="0.5" y="0.5" width="167" height="39" rx="10"/>
    </clipPath>
  </defs>
  <g clip-path="url(#btn_clip_btn-card_dark)">
    <rect width="168" height="40" fill="url(#btn_btn-card_dark)"/>
    <rect x="0" y="1" width="168" height="1" fill="url(#btn_sheen_btn-card_dark)"/>
    <polygon class="shimmer" points="0,0 38,0 18,40 -20,40" fill="#FFFFFF" opacity="0"/>
    <g transform="translate(26.6, 11.5) scale(0.71)" fill="none" stroke="#FFFFFF" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4.5" width="20" height="15" rx="2.5"/><circle cx="8.5" cy="10.2" r="2"/><path d="M5.4 15.8c.6-1.5 1.8-2.2 3.1-2.2s2.5.7 3.1 2.2"/><path d="M14.5 9.8h4.5M14.5 13.4h3.5"/></g>
    <text x="51.6" y="24.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Digital Card</text>
  </g>
  <rect x="0.5" y="0.5" width="167" height="39" rx="10" fill="none" stroke="#837CF8" stroke-width="1"/>
</svg>
