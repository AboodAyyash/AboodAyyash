name: Refresh Executive Dashboard Telemetry

on:
  schedule:
    # Daily at 04:00 UTC (07:00 Amman)
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: telemetry-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate live telemetry SVGs
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [[ -z "${PROFILE_TOKEN}" ]]; then
            echo "PROFILE_TOKEN secret is not set yet; skipping live refresh."
            exit 0
          fi
          python3 scripts/generate_dashboard.py --telemetry-only --strict

      - name: Commit updated telemetry if metrics changed
        run: |
          if [[ -n "$(git status --porcelain assets/telemetry-dark.svg assets/telemetry-light.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/telemetry-dark.svg assets/telemetry-light.svg
            git commit -m "chore(telemetry): refresh live engineering velocity"
            git push
          else
            echo "Telemetry already up to date."
          fi
